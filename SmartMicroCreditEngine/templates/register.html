{% extends "base.html" %}
{% block title %}Register &middot; SmartCredit Engine{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <h1>Create your account</h1>
        <p class="sub">Start evaluating loan applications in seconds.</p>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <span class="hint">At least 6 characters.</span>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <div class="auth-foot">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
        </div>
    </div>
</div>
{% endblock %}
